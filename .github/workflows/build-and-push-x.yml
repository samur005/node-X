name: Build and push node-x

on:
  push:
    tags:
      - '*-x.*'

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/samur005/node-x

jobs:
  build-docker-images:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        run: |
          docker buildx bake plain \
            --set "*.platform=${{ matrix.platform }}" \
            --set "*.args.INTEGRATIONS=qwdtt" \
            --set "*.tags=" \
            --set '*.output=type=image,"name=ghcr.io/samur005/node-x",push-by-digest=true,name-canonical=true,push=true' \
            --metadata-file "${{ runner.temp }}/metadata.json"

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest=$(jq -r '.["plain"]["containerimage.digest"]' "${{ runner.temp }}/metadata.json")
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and push manifests
    needs: [build-docker-images]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR_IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.GHCR_IMAGE }}:latest \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            if gh api -X POST "/users/samur005/packages/container/node-x/visibility" -f visibility=public; then
              echo "Package node-x is public"
              exit 0
            fi
            if gh api -X POST "/user/packages/container/node-x/visibility" -f visibility=public; then
              echo "Package node-x is public"
              exit 0
            fi
            sleep 10
          done
          echo "Could not set node-x visibility to public; the package may stay private."
          exit 0
